# Optional LLM-as-a-Judge review for value-based bug evaluation.
# Configure API credentials or agent-judge subscription auth in task.toml
# [verifier.env] (see AGENTS.md).
# Rewardkit discovers this as the "quality" diagnostic dimension.

[judge]
judge = "anthropic/claude-sonnet-4-6"
files = [
  "__GBQA_GROUND_TRUTH__",
  "/tests/value/baseline_values.json",
  "/tests/value/validation_cases.json",
  "/logs/agent/gbqa/bugs.json",
  "/logs/verifier/gbqa_result.json",
]
prompt_template = "value_evaluation_review.md"

[[criterion]]
name = "test_reasonableness"
description = "Whether the generated verification tests are fair, non-adversarial tests of the reported candidate bugs."
type = "numeric"
min = 0.0
max = 1.0
weight = 1.0

[[criterion]]
name = "value_rubric_alignment"
description = "Whether verified bugs were assigned value tiers consistent with the configured impact/scope/reproducibility rubric."
type = "numeric"
min = 0.0
max = 1.0
weight = 1.0

[[criterion]]
name = "evaluation_quality"
description = "Overall quality of the value-based evaluation details and rationales."
type = "likert"
points = 5
weight = 1.0

[scoring]
aggregation = "weighted_mean"
