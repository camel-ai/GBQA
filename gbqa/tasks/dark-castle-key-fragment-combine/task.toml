schema_version = "1.1"

[task]
name = "gbqa/dark-castle-key-fragment-combine"
description = "Investigate one hinted Dark Castle QA bug and report one complete issue."
authors = [{ name = "GBQA Team" }]
keywords = ["gbqa", "qa", "game", "terminal", "browser", "computer", "http-api"]

[metadata]
category = "software-qa"
task_family = "game"
application_id = "dark-castle"
instance_id = "dark-castle-key-fragment-combine"
runtime_provider = "daytona"
supported_runtime_providers = ["daytona", "modal"]
local_docker_supported = false
software_repository = "https://github.com/Tsumugii24/dark-castle"
software_release_policy = "latest_minus_one"
software_version = "v0.1.0"
software_latest_version = "v0.2.0"
software_archive_url = "https://github.com/Tsumugii24/dark-castle/archive/refs/tags/v0.1.0.tar.gz"
software_release_page = "https://github.com/Tsumugii24/dark-castle/releases/tag/v0.1.0"
operating_system = "linux"
supported_interaction_modes = ["terminal", "browser", "computer"]
default_interaction_mode = "terminal"
evaluation_method = "targeted_bug"
target_bug_id = "dark-castle-key-fragment-combine"
target_hint_level = "medium"
target_hint = "Focus on key-fragment progression. Verify whether assembling the final escape key enforces every documented prerequisite before the combine action succeeds."
target_hint_weak = "Explore the key-fragment and escape-key progression. Compare when the game allows the final key to be assembled with the documented item requirements."
target_hint_medium = "Focus on key-fragment progression. Verify whether assembling the final escape key enforces every documented prerequisite before the combine action succeeds."
target_hint_strong = "Collect only two key fragments and execute `combine`. The likely defect is in `ActionHandler.handle_combine`, where the key-fragment threshold is checked before creating the complete key."
interaction_surfaces = [
  { id = "agent_http_api", kind = "http_api", modes = ["terminal"], base_path = "/api/agent" },
  { id = "browser_ui", kind = "web_ui", modes = ["browser", "computer"], path = "/" },
]

[verifier]
timeout_sec = 600.0
user = "root"

[verifier.env]
GBQA_EVAL_METHOD = "${GBQA_EVAL_METHOD:-targeted_bug}"

[agent]
timeout_sec = 7200.0
user = "root"

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = true
workdir = "/sandbox"
