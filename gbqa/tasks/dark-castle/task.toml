schema_version = "1.1"

[task]
name = "gbqa/dark-castle"
description = "Find seeded QA bugs in the Dark Castle browser/API game."
authors = [{ name = "GBQA Team" }]
keywords = ["gbqa", "qa", "game", "terminal", "browser", "computer", "http-api"]

[metadata]
category = "software-qa"
task_family = "game"
runtime_provider = "daytona"
local_docker_supported = false
software_repository = "https://github.com/Tsumugii24/dark-castle"
software_release_policy = "latest_minus_one"
software_version = "v0.1.0"
software_latest_version = "v0.2.0"
software_archive_url = "https://github.com/Tsumugii24/dark-castle/archive/refs/tags/v0.1.0.tar.gz"
software_release_page = "https://github.com/Tsumugii24/dark-castle/releases/tag/v0.1.0"
operating_system = "linux"
supported_interaction_modes = ["terminal", "browser", "computer"]
default_interaction_mode = "terminal"
interaction_surfaces = [
  { id = "agent_http_api", kind = "http_api", modes = ["terminal"], base_path = "/api/agent" },
  { id = "browser_ui", kind = "web_ui", modes = ["browser", "computer"], path = "/" },
]

[verifier]
timeout_sec = 600.0
user = "root"

[verifier.env]
GBQA_EVAL_METHOD = "${GBQA_EVAL_METHOD:-value_based}"
GBQA_BASELINE_VALUES = "${GBQA_BASELINE_VALUES:-/tests/value/baseline_values.json}"
GBQA_BUG_VALIDATION_CASES = "${GBQA_BUG_VALIDATION_CASES:-/tests/value/validation_cases.json}"
GBQA_BUG_TEST_GENERATOR_CMD = "${GBQA_BUG_TEST_GENERATOR_CMD:-}"
GBQA_BUG_TEST_REASONABLENESS_CMD = "${GBQA_BUG_TEST_REASONABLENESS_CMD:-}"
GBQA_BUG_TEST_EXECUTOR_CMD = "${GBQA_BUG_TEST_EXECUTOR_CMD:-}"
GBQA_VALUE_AGENT_CMD = "${GBQA_VALUE_AGENT_CMD:-}"
REWARDKIT_JUDGE = "${REWARDKIT_JUDGE:-openai/gpt-4o}"
REWARDKIT_MODEL = "${REWARDKIT_MODEL:-}"
REWARDKIT_FORCE_OAUTH = "${REWARDKIT_FORCE_OAUTH:-}"
JUDGE_AGENT = "${JUDGE_AGENT:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-}"
JUDGE_CODEX_MODEL = "${JUDGE_CODEX_MODEL:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
ANTHROPIC_AUTH_TOKEN = "${ANTHROPIC_AUTH_TOKEN:-}"
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_API_BASE = "${OPENAI_API_BASE:-https://zenmux.ai/api/v1}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-https://zenmux.ai/api/v1}"
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
CLAUDE_FORCE_OAUTH = "${CLAUDE_FORCE_OAUTH:-}"
CODEX_AUTH_JSON_PATH = "${CODEX_AUTH_JSON_PATH:-}"
CODEX_AUTH_JSON_B64 = "${CODEX_AUTH_JSON_B64:-}"
CODEX_FORCE_API_KEY = "${CODEX_FORCE_API_KEY:-}"
CODEX_FORCE_AUTH_JSON = "${CODEX_FORCE_AUTH_JSON:-}"
CODEX_ACCESS_TOKEN = "${CODEX_ACCESS_TOKEN:-}"

[agent]
timeout_sec = 7200.0
user = "root"

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = true
workdir = "/sandbox"
