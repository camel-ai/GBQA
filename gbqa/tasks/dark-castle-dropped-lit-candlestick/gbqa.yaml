schema_version: "0.1"
task:
  id: "gbqa/dark-castle-dropped-lit-candlestick"
  application_id: "dark-castle"
  instance_id: "dark-castle-dropped-lit-candlestick"
  family: "game"
  title: "Dark Castle: Dropped Lit Candlestick"
  profile: "Text adventure in a mysterious castle. Investigate the hinted light-source bug, reproduce it, localize it with source evidence when code tools are available, and produce one complete issue report. The target software accepts 'new game' to reset; use lifecycle tools such as 'new_session' to open a fresh exploration path, 'end_session' to close one, or 'switch_session' to move between open sessions."
software:
  type: "github_release"
  repository: "https://github.com/Tsumugii24/dark-castle"
  release_page: "https://github.com/Tsumugii24/dark-castle/releases/tag/v0.1.0"
  archive_url: "https://github.com/Tsumugii24/dark-castle/archive/refs/tags/v0.1.0.tar.gz"
  selected_version: "v0.1.0"
  selected_release_role: "latest_minus_one"
  latest_version: "v0.2.0"
  fixed_reference_version: ""
  install_dir: "/sandbox/software/dark-castle"
  ready_path: "backend/app.py"
runtime:
  default_provider: "daytona"
  local_docker_supported: false
  startup:
    workdir: "{software_install_dir}/backend"
    command: "env PORT={service_port} setsid -f {python} app.py"
    stdout_path: "/logs/runtime/dark-castle-server.log"
    pid_file: "{agent_artifact_dir}/software-service.pid"
  artifact_exports:
    - source: "/sandbox/software/dark-castle/.cache/log/."
      destination: "/logs/runtime/software_session_logs/"
  internal_log_sources:
    - name: "stdout_stderr"
      kind: "file"
      path: "/logs/runtime/dark-castle-server.log"
      description: "Dark Castle backend stdout/stderr captured by the GBQA environment launcher."
      tail_bytes: 200000
    - name: "software_session_logs"
      kind: "file_directory"
      path: "/sandbox/software/dark-castle/.cache/log"
      glob: "game_*.json"
      description: "Dark Castle software-owned per-session JSON logs written by the game backend."
      tail_bytes: 200000
      max_files: 5
interaction:
  default_mode: "terminal"
  supported_modes:
    - "terminal"
    - "browser"
    - "computer"
  adapters:
    computer:
      server_url: "http://127.0.0.1:8030"
      startup_timeout: 30
      sandbox_name: "gbqa-local-computer"
      display:
        width: 1280
        height: 720
metadata:
  operating_system:
    default: "linux"
    supported:
      - "linux"
  interaction_surfaces:
    - id: "agent_http_api"
      kind: "http_api"
      modes:
        - "terminal"
      base_path: "/api/agent"
      description: "JSON action API used by the terminal interaction backend."
    - id: "browser_ui"
      kind: "web_ui"
      modes:
        - "browser"
        - "computer"
      path: "/"
      description: "Playable web frontend for browser automation or screenshot-based computer interaction."
service:
  host: "127.0.0.1"
  port: 5000
  api_base_path: "/api/agent"
  frontend_path: "/"
  health_path: "/api/health"
  session_id_field: "game_id"
  terminal_field: "game_over"
ground_truth:
  path: "bugs/dark-castle.json"
evaluation:
  method: "targeted_bug"
  target_bug_id: "dark-castle-dropped-lit-candlestick"
  hint_level: "medium"
  hints:
    weak: "Explore whether light-producing items keep affecting room visibility when they move between inventory and the room environment."
    medium: "Focus on light-source state after a lit item leaves the player's inventory. Verify whether a dark room remains illuminated after dropping the lit item there."
    strong: "In the basement, light the candlestick, drop it, then execute `look`. The likely defect is in `GameWorld.has_light_source`, which only considers inventory-held lit items."
  hint: "Focus on light-source state after a lit item leaves the player's inventory. Verify whether a dark room remains illuminated after dropping the lit item there."
artifacts:
  agent_dir: "/logs/agent/gbqa"
  verifier_dir: "/logs/verifier"
